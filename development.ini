###
# app configuration
# https://docs.pylonsproject.org/projects/pyramid/en/latest/narr/environment.html
###

[app:main]
use = egg:namifax

pyramid.reload_templates = true
pyramid.debug_authorization = false
pyramid.debug_notfound = false
pyramid.debug_routematch = false
pyramid.default_locale_name = en

# Database. When unset the app uses DATABASE_URL, AFDB_URL or NAMIFAX_DB_PATH (see namifax.db.provider).
# sqlalchemy.url = sqlite:///%(here)s/namifax.db
# pyramid.includes =
#     pyramid_debugtoolbar

# By default, the toolbar only appears for clients from IP addresses
# '127.0.0.1' and '::1'.
# debugtoolbar.hosts = 127.0.0.1 ::1

###
# alembic migration configuration
# https://alembic.sqlalchemy.org/en/latest/tutorial.html
###

[alembic]
# path to migration scripts, as a package resource
script_location = namifax:alembic
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s

###
# wsgi server configuration
###

[server:main]
use = egg:waitress#main
listen = 0.0.0.0:6543

###
# logging configuration
# https://docs.pylonsproject.org/projects/pyramid/en/latest/narr/logging.html
###

[loggers]
keys = root, namifax

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_namifax]
level = DEBUG
handlers =
qualname = namifax

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s:%(lineno)s][%(threadName)s] %(message)s

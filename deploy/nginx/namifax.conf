# /etc/nginx/conf.d/namifax.conf -- NamiFAX behind nginx with HTTPS.
server {
    listen 443 ssl;
    server_name fax.example.com;
    ssl_certificate     /etc/ssl/certs/fax.example.com.pem;
    ssl_certificate_key /etc/ssl/private/fax.example.com.key;

    client_max_body_size 25m;                       # fax uploads (NAMIFAX_MAX_UPLOAD_BYTES is the application's own limit)

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;   # the Origin check (csrf.trusted_origins) reads this
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $remote_addr;
    }

    # Brute-force protection for the password reminder (see docs/ko/install/operations-checklist.md, section 4):
    # limit_req_zone $binary_remote_addr zone=forgot:10m rate=5r/m;   (in the http block)
    # location = /forgot { limit_req zone=forgot burst=5; proxy_pass http://127.0.0.1:8000; }
}

# Old AvantFAX 3.x addresses -> NamiFAX addresses (mod_rewrite). Put this inside the <VirtualHost> of deploy/apache/namifax.conf,
# before the ProxyPass line. The query string of the old address is kept (abook_id, dl_id, uid, devid, catid, ... have the same names).
# Only pages a person opens are listed; the old AJAX and download addresses are called by the pages themselves.
RewriteEngine On

RewriteRule ^/index\.php$                                  /login           [R=301,L]
RewriteRule ^/(inbox|archive|sendfax|outbox|addressbook|emailbook|distrolist|settings|logout|forgot|pwdexpired|txreport|viewfax|email|assign|assignx|rotate|setcompany)\.php$  /$1  [R=301,L]
RewriteRule ^/search\.php$                                 /search          [R=301,L]
RewriteRule ^/(addressbook|emailbook|distrolist)_edit\.php$ /$1/edit        [R=301,L]

# the address or the parameter name changed: pdf.php?fid=N, refax.php?fid=N
RewriteCond %{QUERY_STRING} (?:^|&)fid=([0-9]+)(?:&|$)
RewriteRule ^/pdf\.php$                                    /faxes/download/%1?format=pdf  [R=301,L]
RewriteCond %{QUERY_STRING} (?:^|&)fid=([0-9]+)(?:&|$)
RewriteRule ^/refax\.php$                                  /sendfax?refax=%1              [R=301,L]

# administration
RewriteRule ^/admin/(index|admin)\.php$                    /admin                         [R=301,L]
RewriteRule ^/admin/(users|users_list)\.php$               /admin/users                   [R=301,L]
RewriteRule ^/admin/deluser\.php$                          /admin/users/delete            [R=301,L]
RewriteRule ^/admin/conf_modems(_edit)?\.php$              /admin/modems                  [R=301,L]
RewriteRule ^/admin/conf_didroute(_edit)?\.php$            /admin/routing/did             [R=301,L]
RewriteRule ^/admin/conf_barcoderoute(_edit)?\.php$        /admin/barcodes                [R=301,L]
RewriteRule ^/admin/conf_covers(_edit)?\.php$              /admin/covers                  [R=301,L]
RewriteRule ^/admin/conf_dynconf(_edit)?\.php$             /admin/dynconf                 [R=301,L]
RewriteRule ^/admin/(fax_categories|fax_cat_edit)\.php$    /admin/categories              [R=301,L]
RewriteRule ^/admin/fax2email(_edit)?\.php$                /admin/fax2email               [R=301,L]
RewriteRule ^/admin/system_func\.php$                      /admin/system_func             [R=301,L]
RewriteRule ^/admin/system_logs\.php$                      /admin/system_logs             [R=301,L]

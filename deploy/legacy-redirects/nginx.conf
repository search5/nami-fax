# Old AvantFAX 3.x addresses -> NamiFAX addresses. Include this inside the server block of deploy/nginx/namifax.conf
# ("include /etc/nginx/namifax-legacy-redirects.conf;"), before "location /". The query string of the old address is kept
# (abook_id, dl_id, uid, devid, catid, ... have the same names). Only pages a person opens are listed.

absolute_redirect off;      # send "Location: /inbox", so that a port or scheme behind a proxy is never wrong

location = /index.php { return 301 /login$is_args$args; }
location ~ ^/(inbox|archive|sendfax|outbox|addressbook|emailbook|distrolist|settings|logout|forgot|pwdexpired|txreport|viewfax|email|assign|assignx|rotate|setcompany)\.php$ {
    return 301 /$1$is_args$args;
}
location = /search.php { return 301 /search$is_args$args; }
location ~ ^/(addressbook|emailbook|distrolist)_edit\.php$ { return 301 /$1/edit$is_args$args; }

# the address or the parameter name changed: pdf.php?fid=N, refax.php?fid=N
location = /pdf.php   { if ($arg_fid ~ ^[0-9]+$) { return 301 /faxes/download/$arg_fid?format=pdf; } return 404; }
location = /refax.php { if ($arg_fid ~ ^[0-9]+$) { return 301 /sendfax?refax=$arg_fid; } return 404; }

# administration
location ~ ^/admin/(index|admin)\.php$                 { return 301 /admin$is_args$args; }
location ~ ^/admin/(users|users_list)\.php$            { return 301 /admin/users$is_args$args; }
location = /admin/deluser.php                          { return 301 /admin/users/delete$is_args$args; }
location ~ ^/admin/conf_modems(_edit)?\.php$           { return 301 /admin/modems$is_args$args; }
location ~ ^/admin/conf_didroute(_edit)?\.php$         { return 301 /admin/routing/did$is_args$args; }
location ~ ^/admin/conf_barcoderoute(_edit)?\.php$     { return 301 /admin/barcodes$is_args$args; }
location ~ ^/admin/conf_covers(_edit)?\.php$           { return 301 /admin/covers$is_args$args; }
location ~ ^/admin/conf_dynconf(_edit)?\.php$          { return 301 /admin/dynconf$is_args$args; }
location ~ ^/admin/(fax_categories|fax_cat_edit)\.php$ { return 301 /admin/categories$is_args$args; }
location ~ ^/admin/fax2email(_edit)?\.php$             { return 301 /admin/fax2email$is_args$args; }
location = /admin/system_func.php                      { return 301 /admin/system_func$is_args$args; }
location = /admin/system_logs.php                      { return 301 /admin/system_logs$is_args$args; }

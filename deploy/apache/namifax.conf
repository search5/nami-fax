# /etc/apache2/sites-available/namifax.conf -- NamiFAX behind Apache (mod_proxy, mod_ssl, mod_headers).
<VirtualHost *:443>
    ServerName fax.example.com
    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/fax.example.com.pem
    SSLCertificateKeyFile /etc/ssl/private/fax.example.com.key

    LimitRequestBody 26214400
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    # Web-server login (WEBSERVER_AUTH=1): Apache authenticates, the application trusts REMOTE_USER.
    # Only with a WSGI server that receives it from Apache (mod_wsgi); with a proxy REMOTE_USER is not passed on.
</VirtualHost>
